; Config PHP para el contenedor de desarrollo local.
; El docker-compose.yml lo monta en /usr/local/etc/php/conf.d/local.ini.
; Sin este archivo Docker crearia un DIRECTORIO en su lugar.

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000

display_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = America/Lima
